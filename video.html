<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Video Lingkaran</title>
<meta name="theme-color" content="#008069">
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b141a;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  /* PERMINTAAN ("buatkan seperti pesan suara, tapi video lingkaran"): tata letak meniru perekam
     suara (kartu + header hijau WhatsApp) tapi isinya pratinjau kamera BULAT gaya catatan video
     WhatsApp. Halaman ini WAJIB terpisah dari aplikasi: getUserMedia untuk KAMERA sama-sama
     diblokir sandbox iframe Apps Script, persis seperti mikrofon (lihat catatan panjang di
     startChatVoiceRecording(), chat_js.html). */
  .card{width:min(360px,94vw);background:#111b21;border-radius:16px;overflow:hidden;
    box-shadow:0 12px 34px rgba(0,0,0,.45);display:flex;flex-direction:column}
  .card-head{display:flex;align-items:center;gap:8px;background:#008069;color:#fff;
    padding:7px 12px;font-size:12.5px;font-weight:700;flex-shrink:0}
  .ch-dot{width:8px;height:8px;border-radius:50%;background:#ff5c5c;flex-shrink:0}
  .ch-dot.rec{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .stage{padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
  /* Lingkaran pratinjau - object-fit:cover supaya gambar kamera terpotong rapi jadi bulat,
     bukan gepeng. scaleX(-1) membuat pratinjau seperti cermin (wajar untuk kamera depan). */
  .ring{width:220px;height:220px;border-radius:50%;overflow:hidden;background:#000;
    border:3px solid #008069;position:relative;flex-shrink:0}
  .ring video{width:100%;height:100%;object-fit:cover;display:block}
  .ring video.mirror{transform:scaleX(-1)}
  .timer{font-size:14px;font-weight:700;color:#e9edef;font-variant-numeric:tabular-nums}
  .controls{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
  .btn{border:none;cursor:pointer;border-radius:50%;display:flex;align-items:center;
    justify-content:center;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .btn-main{width:58px;height:58px;background:#e53935;font-size:20px}
  .btn-main.stop{background:#54656f}
  .btn-send{width:52px;height:52px;background:#25d366;font-size:18px}
  .btn-retake{width:44px;height:44px;background:#54656f;font-size:16px}
  .btn-back{width:44px;height:44px;background:#008069;font-size:18px}
  .btn:disabled{opacity:.45;cursor:default}
  .status{font-size:11px;color:#ff8a80;text-align:center;padding:0 10px;line-height:1.35;min-height:14px}
  .status.ok{color:#7ce0a3}
</style>
</head>
<body>
<div class="card">
  <div class="card-head"><span class="ch-dot" id="dot"></span><span id="headText">Video Lingkaran</span></div>
  <div class="stage">
    <div class="ring"><video id="preview" playsinline muted class="mirror"></video></div>
    <div class="timer" id="timer">0:00</div>
    <div class="controls" id="controls">
      <button type="button" class="btn btn-main" id="mainBtn" title="Mulai merekam">⏺</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>
<script>
// Titipan token/groupId/webapp lewat HASH (bukan query) supaya TIDAK ikut terkirim ke server
// hosting/log - fragment URL murni sisi-klien. Pola SAMA dengan perekam suara.
function getHashParams() {
  var params = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (pair) {
    var i = pair.indexOf('='); if (i === -1) return;
    params[decodeURIComponent(pair.slice(0, i))] = decodeURIComponent(pair.slice(i + 1));
  });
  return params;
}
var PARAMS = getHashParams();
var previewEl = document.getElementById('preview');
var timerEl = document.getElementById('timer');
var dotEl = document.getElementById('dot');
var statusEl = document.getElementById('status');
var mainBtn = document.getElementById('mainBtn');
var controlsEl = document.getElementById('controls');
var headEl = document.getElementById('headText');

var stream = null, recorder = null, chunks = [], blob = null;
var startTime = 0, timerInt = null;

function setStatus(msg, ok) { statusEl.textContent = msg || ''; statusEl.className = 'status' + (ok ? ' ok' : ''); }
function fmt(sec) { var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }

// Kamera dinyalakan begitu halaman terbuka (pratinjau saja, BELUM merekam) - user menekan ⏺
// sendiri untuk mulai, sesuai pola perekam suara yang juga tidak langsung merekam.
function startPreview() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
    setStatus('Perekaman video tidak didukung di browser ini.'); mainBtn.disabled = true; return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true }).then(function (s) {
    stream = s;
    previewEl.srcObject = s; previewEl.muted = true;
    previewEl.play().catch(function () {});
    setStatus('');
  }).catch(function (e) {
    setStatus('Tidak bisa mengakses kamera (' + ((e && e.name) || 'error') + '). Pastikan izin kamera & mikrofon diizinkan untuk halaman ini.');
    mainBtn.disabled = true;
  });
}
function startRecording() {
  if (!stream) return;
  var preferred = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
    .find(function (t) { return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t); });
  recorder = preferred ? new MediaRecorder(stream, { mimeType: preferred }) : new MediaRecorder(stream);
  chunks = [];
  recorder.ondataavailable = function (e) { if (e.data && e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = onRecordingStop;
  recorder.start();
  startTime = Date.now();
  timerInt = setInterval(function () { timerEl.textContent = fmt(Math.floor((Date.now() - startTime) / 1000)); }, 500);
  timerEl.textContent = '0:00';
  dotEl.classList.add('rec'); headEl.textContent = 'Merekam...';
  mainBtn.textContent = '⏹'; mainBtn.classList.add('stop'); mainBtn.title = 'Berhenti';
  // PERMINTAAN (sebelumnya, tetap berlaku di sini): TIDAK ADA batas waktu otomatis - user yang
  // menentukan sendiri kapan berhenti.
}
function stopRecording() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  if (timerInt) { clearInterval(timerInt); timerInt = null; }
  dotEl.classList.remove('rec');
}
function onRecordingStop() {
  var mimeType = (recorder && recorder.mimeType) || 'video/webm';
  blob = new Blob(chunks, { type: mimeType });
  chunks = [];
  if (!blob.size) { setStatus('Rekaman kosong, coba lagi.'); resetToIdle(); return; }
  // Pratinjau hasil rekaman di lingkaran yang SAMA - user bisa menilai dulu sebelum mengirim.
  // Suara TIDAK di-mute di sini supaya hasilnya benar-benar bisa diperiksa.
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  previewEl.srcObject = null;
  previewEl.src = URL.createObjectURL(blob);
  previewEl.muted = false; previewEl.loop = true;
  previewEl.classList.remove('mirror'); // hasil rekaman TIDAK dicerminkan, hanya pratinjau live
  previewEl.play().catch(function () {});
  headEl.textContent = 'Pratinjau';
  controlsEl.innerHTML =
    '<button type="button" class="btn btn-retake" id="retakeBtn" title="Ulangi">↺</button>' +
    '<button type="button" class="btn btn-send" id="sendBtn" title="Kirim">➤</button>';
  document.getElementById('retakeBtn').onclick = function () { resetToIdle(); startPreview(); };
  document.getElementById('sendBtn').onclick = sendVideo;
}
function resetToIdle() {
  blob = null;
  previewEl.src = ''; previewEl.loop = false; previewEl.muted = true;
  previewEl.classList.add('mirror');
  timerEl.textContent = '0:00';
  headEl.textContent = 'Video Lingkaran';
  controlsEl.innerHTML = '<button type="button" class="btn btn-main" id="mainBtn" title="Mulai merekam">⏺</button>';
  mainBtn = document.getElementById('mainBtn');
  mainBtn.onclick = onMainClick;
  setStatus('');
}
function onMainClick() {
  if (!recorder || recorder.state === 'inactive') startRecording();
  else stopRecording();
}
// Pengiriman berjalan di LATAR BELAKANG - layar langsung berganti tombol kembali, sesuai pola
// perekam suara ("jangan terkesan lambat"). Pesan galat hanya muncul kalau BENAR-BENAR gagal.
function sendVideo() {
  if (!blob) return;
  var durationSec = Math.max(1, Math.round((Date.now() - startTime) / 1000));
  var mimeType = blob.type || 'video/webm';
  headEl.textContent = 'Video Lingkaran';
  controlsEl.innerHTML = '<button type="button" class="btn btn-back" id="backBtn" title="Kembali ke Chat">&#8592;</button>';
  document.getElementById('backBtn').onclick = function () { window.close(); };
  previewEl.pause();
  var reader = new FileReader();
  reader.onload = function (e) {
    var form = new FormData();
    form.append('action', 'uploadChatVideoNote');
    form.append('token', PARAMS.token);
    form.append('groupId', PARAMS.groupId);
    form.append('mimeType', mimeType);
    form.append('videoBase64', String(e.target.result).split(',')[1] || '');
    form.append('durationLabel', '🎥 ' + fmt(durationSec));
    // FormData/multipart adalah content-type yang aman-CORS, jadi TIDAK memicu preflight OPTIONS
    // (Apps Script tidak menangani doOptions dengan baik) - pola sama dengan perekam suara.
    fetch(PARAMS.webapp, { method: 'POST', body: form })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.error) { setStatus('Gagal: ' + j.error); return; }
        window.close();
      })
      .catch(function () { setStatus('Gagal mengirim - periksa koneksi internet.'); });
  };
  reader.readAsDataURL(blob);
}
mainBtn.onclick = onMainClick;
if (PARAMS.token && PARAMS.groupId && PARAMS.webapp) {
  startPreview();
} else {
  controlsEl.innerHTML = '<button type="button" class="btn btn-back" id="backBtn" title="Tutup">&#8592;</button>';
  document.getElementById('backBtn').onclick = function () { window.close(); };
  setStatus('Halaman ini hanya bisa dipakai dari tombol video di dalam aplikasi. Silakan tutup, lalu tekan tombol 🎥 di halaman Chat.');
}
</script>
</body>
</html>
