<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat Video</title>
<meta name="theme-color" content="#008069">
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b141a;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  /* PERMINTAAN ("buatkan seperti pesan suara, tapi video lingkaran"): tata letak meniru perekam
     suara (kartu + header hijau WhatsApp) tapi isinya pratinjau kamera BULAT gaya catatan video
     WhatsApp. Halaman ini WAJIB terpisah dari aplikasi: getUserMedia untuk KAMERA sama-sama
     diblokir sandbox iframe Apps Script, persis seperti mikrofon (lihat catatan panjang di
     startChatVoiceRecording(), chat_js.html). */
  .card{width:min(360px,94vw);background:#111b21;border-radius:16px;overflow:hidden;
    box-shadow:0 12px 34px rgba(0,0,0,.45);display:flex;flex-direction:column}
  .card-head{display:flex;align-items:center;gap:8px;background:#008069;color:#fff;
    padding:7px 12px;font-size:12.5px;font-weight:700;flex-shrink:0}
  .ch-dot{width:8px;height:8px;border-radius:50%;background:#ff5c5c;flex-shrink:0}
  /* Tombol kembali - sama persis dengan yang di Chat Audio, supaya dua halaman ini konsisten. */
  .head-back{background:none;border:none;color:#fff;font-size:17px;line-height:1;cursor:pointer;
    padding:0 2px;margin-right:2px;flex-shrink:0}
  .ch-dot.rec{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .stage{padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
  /* Lingkaran pratinjau - object-fit:cover supaya gambar kamera terpotong rapi jadi bulat,
     bukan gepeng. scaleX(-1) membuat pratinjau seperti cermin (wajar untuk kamera depan). */
  .ring{width:220px;height:220px;border-radius:50%;overflow:hidden;background:#000;
    border:3px solid #008069;position:relative;flex-shrink:0}
  .ring video{width:100%;height:100%;object-fit:cover;display:block}
  .ring video.mirror{transform:scaleX(-1)}
  /* PERMINTAAN ("saat mengirim, yang berputar adalah LINGKARAN VIDEONYA, bukan tombol kembali -
     dan kecepatannya sesuai kebutuhan kirim, seperti mengunduh; penuh berarti selesai"): ini
     progres SUNGGUHAN, bukan animasi berputar yang panjangnya ditebak. Nilainya datang dari
     xhr.upload.onprogress (byte yang benar-benar sudah terkirim) dan ditulis ke --p. conic-
     gradient menggambar busur sebesar itu, lalu mask melubangi tengahnya jadi CINCIN supaya
     videonya tetap terlihat di dalam. */
  .ring.sending::after{content:'';position:absolute;inset:-6px;border-radius:50%;pointer-events:none;
    background:conic-gradient(#25d366 calc(var(--p,0) * 1%), rgba(255,255,255,.16) 0);
    -webkit-mask:radial-gradient(circle, transparent calc(50% - 5px), #000 calc(50% - 4px));
    mask:radial-gradient(circle, transparent calc(50% - 5px), #000 calc(50% - 4px))}
  .timer{font-size:14px;font-weight:700;color:#e9edef;font-variant-numeric:tabular-nums}
  .controls{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
  .btn{border:none;cursor:pointer;border-radius:50%;display:flex;align-items:center;
    justify-content:center;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .btn-main{width:58px;height:58px;background:#e53935;font-size:20px}
  .btn-main.stop{background:#54656f}
  .btn-send{width:52px;height:52px;background:#25d366;font-size:18px}
  .btn-retake{width:44px;height:44px;background:#54656f;font-size:16px}
  .btn-back{width:44px;height:44px;background:#008069;font-size:18px}
  /* PERBAIKAN AKAR MASALAH ("video dikirim, lalu kembali, ditunggu di chat tidak muncul"):
     pengiriman berjalan di LATAR BELAKANG dan tombol kembali langsung menutup jendela - kalau
     ditekan sebelum unggahan selesai, window.close() MEMBUNUH permintaan yang sedang berjalan
     dan videonya tidak pernah sampai ke server. Audio tidak kena karena berkasnya kecil dan
     selesai dalam sekejap; video butuh beberapa detik, jadi hampir selalu keburu ditutup.
     Sekarang tombol kembali DIKUNCI selama pengiriman berlangsung, ditandai cincin berputar
     (isyarat visual, TANPA tulisan "Mengirim..."), dan jendela menutup SENDIRI begitu benar-
     benar terkirim. */
  /* Tombol kembali tetap DIKUNCI selama pengiriman (menutup jendela membunuh permintaannya -
     lihat catatan di sendVideo()), tapi cincin berputarnya dipindah ke lingkaran video sesuai
     permintaan. Di sini cukup diredupkan supaya jelas belum bisa ditekan. */
  .btn-back.uploading{opacity:.45;cursor:default}
  .btn:disabled{opacity:.45;cursor:default}
  .status{font-size:11px;color:#ff8a80;text-align:center;padding:0 10px;line-height:1.35;min-height:14px}
  .status.ok{color:#7ce0a3}
</style>
</head>
<body>
<div class="card">
  <div class="card-head"><button type="button" class="head-back" id="headBackBtn" title="Kembali ke Chat" aria-label="Kembali ke Chat">&#8592;</button><span class="ch-dot" id="dot"></span><span id="headText">Chat Video</span></div>
  <div class="stage">
    <div class="ring"><video id="preview" playsinline muted class="mirror"></video></div>
    <div class="timer" id="timer">0:00</div>
    <div class="controls" id="controls">
      <button type="button" class="btn btn-main" id="mainBtn" title="Mulai merekam">⏺</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>
<script>
// Titipan token/groupId/webapp lewat HASH (bukan query) supaya TIDAK ikut terkirim ke server
// hosting/log - fragment URL murni sisi-klien. Pola SAMA dengan perekam suara.
function getHashParams() {
  var params = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (pair) {
    var i = pair.indexOf('='); if (i === -1) return;
    params[decodeURIComponent(pair.slice(0, i))] = decodeURIComponent(pair.slice(i + 1));
  });
  return params;
}
var PARAMS = getHashParams();
var previewEl = document.getElementById('preview');
var timerEl = document.getElementById('timer');
var dotEl = document.getElementById('dot');
var statusEl = document.getElementById('status');
var mainBtn = document.getElementById('mainBtn');
var controlsEl = document.getElementById('controls');
var headEl = document.getElementById('headText');

var stream = null, recorder = null, chunks = [], blob = null;
var startTime = 0, timerInt = null;

function setStatus(msg, ok) { statusEl.textContent = msg || ''; statusEl.className = 'status' + (ok ? ' ok' : ''); }
function fmt(sec) { var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }

// Kamera dinyalakan begitu halaman terbuka (pratinjau saja, BELUM merekam) - user menekan ⏺
// sendiri untuk mulai, sesuai pola perekam suara yang juga tidak langsung merekam.
function startPreview() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
    setStatus('Perekaman video tidak didukung di browser ini.'); mainBtn.disabled = true; return;
  }
  // PERBAIKAN (dilaporkan: "video lingkaran dikirim tapi tidak muncul di chat sama sekali"):
  // kamera default merekam resolusi PENUH (bisa 1080p) - beberapa puluh detik saja sudah puluhan
  // MB, dan seluruh isinya harus dikirim sebagai base64 dalam SATU POST lalu di-decode di Apps
  // Script. Itu titik paling mungkin gagalnya (batas ukuran/waktu eksekusi), dan gagalnya diam-
  // diam. Padahal di chat videonya cuma tampil dalam lingkaran 160px - 480x480 sudah lebih dari
  // cukup. Resolusi & bitrate dibatasi di sini supaya berkasnya kecil sejak awal.
  navigator.mediaDevices.getUserMedia({
    // PERBAIKAN LANJUTAN (dilaporkan: "masih gagal - koneksi terputus, padahal nonton YouTube
    // lancar"): YouTube lancar itu UNDUH; yang dipakai di sini JALUR UNGGAH, yang di jaringan
    // seluler biasa 10-20x lebih lambat - keduanya tidak bisa dijadikan pembanding. Sudah diukur:
    // server memproses 800KB dalam ~5 detik dari koneksi baik, jadi hambatannya murni di jalan
    // naiknya. Satu-satunya pengungkit nyata adalah memperkecil berkasnya: 480 -> 360 piksel dan
    // 24 -> 20 fps. Di chat videonya tampil dalam lingkaran 170px, jadi 360 masih dua kali lipat
    // dari yang benar-benar terlihat.
    video: { facingMode: 'user', width: { ideal: 360 }, height: { ideal: 360 }, frameRate: { ideal: 20, max: 24 } },
    audio: true
  }).then(function (s) {
    stream = s;
    previewEl.srcObject = s; previewEl.muted = true;
    previewEl.play().catch(function () {});
    setStatus('');
  }).catch(function (e) {
    setStatus('Tidak bisa mengakses kamera (' + ((e && e.name) || 'error') + '). Pastikan izin kamera & mikrofon diizinkan untuk halaman ini.');
    mainBtn.disabled = true;
  });
}
function startRecording() {
  if (!stream) { setStatus('Kamera belum siap - izinkan akses kamera & mikrofon untuk halaman ini, lalu coba lagi.'); return; }
  var preferred = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
    .find(function (t) { return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t); });
  // Bitrate dijepit juga - constraint kamera saja tidak menjamin ukuran berkas kecil kalau
  // perangkat mengabaikan permintaan resolusi.
  // PERBAIKAN (dilaporkan: "chat video masih SANGAT LAMA terkirim dan gagal"): bitrate diturunkan
  // lagi (700k -> 420k video, 64k -> 32k audio). Videonya tampil dalam lingkaran 170px di chat -
  // pada ukuran setampil itu selisih 700k vs 420k praktis tidak terlihat, sementara berkasnya
  // hampir setengahnya. Ini pengurangan waktu unggah yang paling langsung terasa: base64 masih
  // menambah 33% lagi di atas ukuran berkas, dan seluruhnya harus lewat dalam satu POST.
  var opts = { videoBitsPerSecond: 300000, audioBitsPerSecond: 32000 };
  if (preferred) opts.mimeType = preferred;
  recorder = new MediaRecorder(stream, opts);
  chunks = [];
  recorder.ondataavailable = function (e) { if (e.data && e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = onRecordingStop;
  recorder.start();
  startTime = Date.now();
  timerInt = setInterval(function () { timerEl.textContent = fmt(Math.floor((Date.now() - startTime) / 1000)); }, 500);
  timerEl.textContent = '0:00';
  dotEl.classList.add('rec'); headEl.textContent = 'Merekam...';
  mainBtn.textContent = '⏹'; mainBtn.classList.add('stop'); mainBtn.title = 'Berhenti';
  // PERMINTAAN (sebelumnya, tetap berlaku di sini): TIDAK ADA batas waktu otomatis - user yang
  // menentukan sendiri kapan berhenti.
}
function stopRecording() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  if (timerInt) { clearInterval(timerInt); timerInt = null; }
  dotEl.classList.remove('rec');
}
// PERMINTAAN ("percepat proses pengirimannya"): mengubah rekaman jadi base64 memakan waktu
// nyata untuk berkas beberapa MB. Dulu itu baru dimulai SETELAH tombol kirim ditekan, jadi user
// menunggu dua tahap berturut-turut: encode lalu unggah. Sekarang encode dimulai DIAM-DIAM
// begitu perekaman berhenti - selagi user menonton pratinjau - sehingga saat kirim ditekan
// datanya biasanya sudah siap dan yang tersisa hanya unggahannya saja.
var preparedBase64 = null, preparingFor = null;
function prepareBase64(forBlob) {
  preparedBase64 = null; preparingFor = forBlob;
  var r = new FileReader();
  r.onload = function (e) {
    if (preparingFor !== forBlob) return; // rekaman sudah diganti - hasil ini basi, buang
    var d = String(e.target.result), i = d.indexOf('base64,');
    preparedBase64 = i === -1 ? '' : d.slice(i + 7);
  };
  r.readAsDataURL(forBlob);
}
function onRecordingStop() {
  var mimeType = (recorder && recorder.mimeType) || 'video/webm';
  blob = new Blob(chunks, { type: mimeType });
  chunks = [];
  if (!blob.size) { setStatus('Rekaman kosong, coba lagi.'); resetToIdle(); return; }
  // Pratinjau hasil rekaman di lingkaran yang SAMA - user bisa menilai dulu sebelum mengirim.
  // Suara TIDAK di-mute di sini supaya hasilnya benar-benar bisa diperiksa.
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  previewEl.srcObject = null;
  previewEl.src = URL.createObjectURL(blob);
  previewEl.muted = false; previewEl.loop = true;
  previewEl.classList.remove('mirror'); // hasil rekaman TIDAK dicerminkan, hanya pratinjau live
  previewEl.play().catch(function () {});
  prepareBase64(blob);
  headEl.textContent = 'Pratinjau';
  controlsEl.innerHTML =
    '<button type="button" class="btn btn-retake" id="retakeBtn" title="Ulangi">↺</button>' +
    '<button type="button" class="btn btn-send" id="sendBtn" title="Kirim">➤</button>';
  document.getElementById('retakeBtn').onclick = function () { resetToIdle(); startPreview(); };
  document.getElementById('sendBtn').onclick = sendVideo;
}
function resetToIdle() {
  blob = null;
  previewEl.src = ''; previewEl.loop = false; previewEl.muted = true;
  previewEl.classList.add('mirror');
  timerEl.textContent = '0:00';
  headEl.textContent = 'Chat Video';
  controlsEl.innerHTML = '<button type="button" class="btn btn-main" id="mainBtn" title="Mulai merekam">⏺</button>';
  mainBtn = document.getElementById('mainBtn');
  mainBtn.onclick = onMainClick;
  setStatus('');
}
function onMainClick() {
  if (!recorder || recorder.state === 'inactive') startRecording();
  else stopRecording();
}
// Pengiriman berjalan di LATAR BELAKANG - layar langsung berganti tombol kembali, sesuai pola
// perekam suara ("jangan terkesan lambat"). Pesan galat hanya muncul kalau BENAR-BENAR gagal.
function sendVideo() {
  if (!blob) { setStatus('Belum ada rekaman untuk dikirim - tekan tombol merah dulu untuk merekam.'); return; }
  if (!PARAMS.webapp) { setStatus('Alamat aplikasi tidak terbaca - tutup halaman ini lalu buka lagi lewat tombol video di Chat.'); return; }
  if (!PARAMS.token || !PARAMS.groupId) { setStatus('Data grup/sesi tidak terbaca - tutup halaman ini lalu buka lagi lewat tombol video di Chat.'); return; }
  var durationSec = Math.max(1, Math.round((Date.now() - startTime) / 1000));
  var mimeType = blob.type || 'video/webm';
  var sizeMb = (blob.size / 1048576).toFixed(1);
  var ringEl = document.querySelector('.ring');
  headEl.textContent = 'Chat Video';
  controlsEl.innerHTML = '<button type="button" class="btn btn-back uploading" id="backBtn" title="Sedang dikirim" disabled>&#8592;</button>';
  var backBtn = document.getElementById('backBtn');
  var unlockBack = function () {
    if (ringEl) ringEl.classList.remove('sending');
    backBtn.classList.remove('uploading');
    backBtn.disabled = false;
    backBtn.title = 'Kembali ke Chat';
    backBtn.onclick = function () { window.close(); };
  };
  previewEl.pause();
  // Cincin progres menempel di LINGKARAN VIDEO (bukan tombol kembali), mulai dari 0.
  if (ringEl) { ringEl.classList.add('sending'); ringEl.style.setProperty('--p', '0'); }

  var kirim = function (base64) {
    if (!base64) { unlockBack(); setStatus('Gagal menyiapkan hasil rekaman di perangkat ini.'); return; }
    var form = new FormData();
    form.append('action', 'uploadChatVideoNote');
    form.append('token', PARAMS.token);
    form.append('groupId', PARAMS.groupId);
    form.append('mimeType', mimeType);
    form.append('videoBase64', base64);
    form.append('durationLabel', '🎥 ' + fmt(durationSec));
    // XMLHttpRequest dipakai (bukan fetch) SEMATA karena hanya XHR yang melaporkan kemajuan
    // UNGGAHAN lewat xhr.upload.onprogress - fetch tidak punya itu sama sekali. Jadi cincin di
    // lingkaran video digerakkan oleh byte yang BENAR-BENAR sudah terkirim, bukan animasi
    // bertempo tetap yang panjangnya ditebak.
    // PERBAIKAN (dilaporkan: "Gagal mengirim - koneksi terputus"): sudah diverifikasi lewat curl
    // bahwa endpoint /exec-nya sehat (302 + echo, keduanya berheader Access-Control-Allow-Origin:
    // *, doPost benar-benar dieksekusi), jadi putusnya ada di perjalanan unggahan - bukan server,
    // bukan CORS. Ditambah timeout eksplisit (tanpa ini XHR bisa menggantung sangat lama tanpa
    // kabar - persis keluhan "sangat lama") dan SATU kali coba-ulang otomatis, karena unggahan
    // seluler yang putus karena sinyal berkedip umumnya lolos di percobaan kedua.
    var attempt = 0;
    var send = function () {
    attempt++;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', PARAMS.webapp, true);
    xhr.timeout = 120000;
    xhr.upload.onprogress = function (ev) {
      if (!ev.lengthComputable || !ringEl) return;
      var pct = Math.round((ev.loaded / ev.total) * 100);
      // Ditahan di 96% sampai server benar-benar menjawab: byte terkirim belum berarti sudah
      // tersimpan. 100% baru ditulis saat jawaban sukses datang, supaya "penuh = selesai"
      // benar-benar jujur, bukan sekadar "sudah dikirim ke jaringan".
      ringEl.style.setProperty('--p', String(Math.min(96, pct)));
    };
    xhr.onload = function () {
      var teks = xhr.responseText || '';
      var j = null; try { j = JSON.parse(teks); } catch (e) {}
      if (j && (j.success || j.id || j.message)) {
        if (ringEl) ringEl.style.setProperty('--p', '100');
        setTimeout(function () { window.close(); }, 250);
        return;
      }
      unlockBack();
      if (j && j.error) { setStatus('Gagal: ' + j.error + ' (' + sizeMb + ' MB)'); return; }
      setStatus('Gagal kirim - server menjawab ' + xhr.status + ' (' + sizeMb + ' MB). ' + String(teks).replace(/<[^>]*>/g, ' ').trim().slice(0, 90));
    };
    var gagal = function (sebab) {
      // Dua kali coba-ulang (bukan satu): di sinyal seluler yang berkedip, percobaan yang gagal
      // sering beruntun - menyerah setelah satu kali membuang rekaman yang sebenarnya masih bisa
      // lolos. Total tiga percobaan sebelum benar-benar menyerah.
      if (attempt < 3) {
        if (ringEl) ringEl.style.setProperty('--p', '0');
        setStatus('Koneksi terputus, mencoba ulang...');
        send();
        return;
      }
      unlockBack();
      // Rekamannya masih utuh - tombol kirim dimunculkan lagi supaya tidak perlu merekam ulang.
      controlsEl.innerHTML = '<button type="button" class="btn btn-back" id="backBtn" title="Kembali ke Chat">&#8592;</button>' +
        '<button type="button" class="btn btn-send" id="sendBtn" title="Kirim ulang">&#10148;</button>';
      document.getElementById('backBtn').onclick = function () { window.close(); };
      document.getElementById('sendBtn').onclick = sendVideo;
      setStatus('Gagal (' + sizeMb + ' MB): ' + sebab + ' - tekan kirim lagi.');
    };
    xhr.onerror = function () { gagal('koneksi terputus'); };
    xhr.ontimeout = function () { gagal('waktu habis 2 menit'); };
    xhr.send(form);
    };
    send();
  };

  // Kalau pra-encode (dimulai sejak perekaman berhenti) sudah selesai, langsung kirim. Kalau
  // belum, tunggu sampai siap - tetap jauh lebih cepat daripada memulai encode dari nol di sini.
  if (preparedBase64 !== null) { kirim(preparedBase64); return; }
  var tunggu = setInterval(function () {
    if (preparedBase64 === null) return;
    clearInterval(tunggu);
    kirim(preparedBase64);
  }, 100);
}
mainBtn.onclick = onMainClick;
// Tombol kembali di header - tersedia kapan saja. Kamera & mikrofon dimatikan dulu supaya
// lampu indikator perangkat tidak tetap menyala setelah jendelanya ditutup.
document.getElementById('headBackBtn').onclick = function () {
  try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch (e) {}
  try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
  window.close();
};
if (PARAMS.token && PARAMS.groupId && PARAMS.webapp) {
  startPreview();
} else {
  controlsEl.innerHTML = '<button type="button" class="btn btn-back" id="backBtn" title="Tutup">&#8592;</button>';
  document.getElementById('backBtn').onclick = function () { window.close(); };
  setStatus('Halaman ini hanya bisa dipakai dari tombol video di dalam aplikasi. Silakan tutup, lalu tekan tombol 🎥 di halaman Chat.');
}
</script>
</body>
</html>
