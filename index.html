<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat Audio</title>
<!-- PERMINTAAN ("tutup/samarkan top bar jendela perekaman agar tampak bagus"): bar judul &
     alamat itu milik BROWSER, TIDAK BISA disembunyikan/ditransparankan oleh halaman mana pun -
     itu penjaga anti-penyamaran bawaan browser (lihat catatan di startChatVoiceRecording()).
     Yang BISA dilakukan: theme-color memberi warna pada bar judul di sebagian platform
     (Windows/Android) sehingga menyatu dengan header hijau kartu, bukan warna asing. Judul
     halaman juga dipendekkan jadi "Chat Audio" - sama dengan tulisan di header kartu, supaya
     kalaupun bar judulnya terlihat, isinya konsisten & tidak terbaca seperti situs lain. -->
<meta name="theme-color" content="#008069">
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  /* PERMINTAAN ("jadikan background & warna pop perekaman audio PERSIS seperti perekaman video
     lingkaran, biar serasi"): palet disamakan dengan video.html - latar halaman #0b141a dan badan
     kartu #111b21 (keduanya warna gelap khas WhatsApp), bukan lagi abu terang #f0f0f0/#efeae2
     yang membuat kedua halaman terasa dari aplikasi berbeda. Header hijau #008069 memang sudah
     sama sejak awal, jadi tidak disentuh. */
  html,body{margin:0;height:100%;background:#0b141a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
  /* PERBAIKAN (terlihat di Image/Tutupi top bar.png - ada sisa putih kosong di bawah bar):
     kartu MENGISI tinggi jendela popup, jadi tidak ada area menganggur berwarna beda. Di layar
     tinggi (mode kartu mengambang HP, lihat media query di bawah) perilaku lama dipulihkan. */
  body{display:flex;align-items:stretch;justify-content:center}
  /* PERMINTAAN ("buat persis seperti di whatsapp... tanpa tulisan apapun... user merasa itu
     bagian dari aplikasi"): bar TIPIS horizontal gaya WhatsApp Desktop (lihat referensi
     Image/buat tombol perekaman audio.png) - trash/batal, titik-timer berkedip, garis
     titik-titik dekoratif, jeda, kirim. TIDAK ADA judul/hint text - hanya ikon+angka. Ini
     tampilan DEFAULT, dipakai apa adanya saat jendela ini benar-benar popup kecil 360x70
     (desktop, lihat startChatVoiceRecording() di chat_js.html - window.open dgn ukuran itu). */
  /* PERMINTAAN ("perbagus tampilan kartu perekaman di laptop agar COCOK DENGAN HALAMAN CHAT" -
     lihat referensi Image/perbagus tampilan halaman audio.png yang menunjukkan bar polos dengan
     tombol biru, tidak senada): kartu sekarang meniru bahasa visual halaman chat - header hijau
     WhatsApp #008069 (SAMA PERSIS dengan .chat-overlay-header), badan warna wallpaper chat
     #efeae2, sudut membulat, dan aksen hijau #25d366 untuk tombol kirim (tidak ada lagi biru
     yang asing dari palet chat). */
  .card{width:100%;background:#111b21;display:flex;flex-direction:column;justify-content:center}
  .card-head{display:flex;align-items:center;gap:8px;background:#008069;color:#fff;
    padding:7px 12px;font-size:12.5px;font-weight:700;flex-shrink:0}
  /* PERMINTAAN ("sediakan tombol kembali, supaya kalau tidak jadi merekam mudah kembali ke
     halaman chat"): panah di ujung KIRI header - posisi yang lazim untuk "kembali" di aplikasi
     mana pun, jadi tidak perlu tulisan penjelas. Menutup jendela perekam = kembali ke halaman
     chat yang memang masih terbuka di baliknya. */
  .head-back{background:none;border:none;color:#fff;font-size:17px;line-height:1;cursor:pointer;
    padding:0 2px;margin-right:2px;flex-shrink:0}
  /* PERBAIKAN (dilaporkan: "saat belum merekam jangan ada tombol berkedip seakan-akan sedang
     merekam"): titik merah di header dulu berkedip TERUS sejak halaman dibuka - memberi kesan
     perekaman sudah berjalan padahal belum. Sekarang diam & redup saat siap, berkedip HANYA
     ketika benar-benar merekam (class .rec dipasang/dilepas oleh setRecordingUi()/setIdleUi()). */
  .card-head .ch-dot{width:8px;height:8px;border-radius:50%;background:#ff5c5c;flex-shrink:0;
    opacity:.3}
  .card-head .ch-dot.rec{opacity:1;animation:chatRecPulse 1.1s ease-in-out infinite}
  /* PERBAIKAN (dilaporkan: "tombol kirim audio TERPOTONG di laptop"): keadaan review menambah
     tombol play di samping tombol rekam, jadi isi bar bertambah satu dan melewati lebar jendela
     popup. Jarak antar kontrol dirapatkan & jendela dilebarkan (lihat window.resizeTo di bawah
     dan ukuran window.open di chat_js.html) supaya semuanya muat tanpa memotong apa pun. */
  .bar{display:none;align-items:center;gap:6px;height:62px;padding:0 10px}
  .bar.show{display:flex}
  /* PERBAIKAN (dilaporkan: "di HP tombol kirim audio TERPOTONG sehingga audio tidak bisa
     dikirim"): di layar sempit isi bar melebihi lebar kartu, dan karena semua kontrol
     flex-shrink:0 yang paling kanan (tombol KIRIM) terdorong keluar area terlihat. Di bawah
     420px bar dibolehkan membungkus ke baris kedua & tingginya mengikuti isi, grafik dipindah
     ke baris sendiri - semua tombol tetap terjangkau. */
  @media(max-width:470px){
    .bar{flex-wrap:wrap;height:auto;padding:8px 10px;gap:8px;justify-content:flex-end}
    .waveform{order:-1;flex-basis:100%;margin:2px 0}
    .src-select,.mic-select{max-width:none;flex:1 1 auto;font-size:11px}
  }
  .icon-btn{background:none;border:none;font-size:19px;cursor:pointer;padding:6px;
    color:rgba(233,237,239,.75);flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .icon-btn:hover{background:rgba(255,255,255,.08)}
  .dot{width:9px;height:9px;border-radius:50%;background:#e53935;flex-shrink:0;
    animation:chatRecPulse 1.1s ease-in-out infinite}
  .dot.paused{animation:none;opacity:.3}
  @keyframes chatRecPulse{0%,100%{opacity:1}50%{opacity:.25}}
  .timer{font-size:13.5px;font-weight:600;color:#e9edef;font-variant-numeric:tabular-nums;flex-shrink:0}
  /* PERMINTAAN ("dropdown pilih mikrofon, tetap sesuai pilihan terakhir sampai diganti"):
     select NATIVE (bukan dropdown custom) - browser yang urus popup daftar device, kita hanya
     styling supaya blend jadi kontrol kecil ikon-ish, konsisten dengan bar minim-teks ini. */
  .mic-select{flex-shrink:0;max-width:54px;font-size:9.5px;color:rgba(233,237,239,.7);background:#111b21;
    border:none;cursor:pointer;padding:2px 0}
  @media(prefers-color-scheme:dark){ .mic-select{color:rgba(233,237,239,.65)} }
  .waveform{flex:1;height:2px;min-width:40px;
    background-image:linear-gradient(to right,#3b4a54 55%,transparent 0%);
    background-size:6px 2px;background-repeat:repeat-x}
  /* PERMINTAAN ("tombol perekaman berupa BULAT MERAH, saat berjalan jadi tombol stop"): tombol
     khusus rekam/stop - lingkaran merah polos saat siap, dan saat merekam muncul KOTAK PUTIH di
     tengahnya (bahasa visual rec/stop yang lazim di perekam mana pun). Terpisah total dari tombol
     play/pause yang tugasnya HANYA mendengarkan hasil rekaman. */
  .rec-btn{width:34px;height:34px;border-radius:50%;background:#e53935;border:none;cursor:pointer;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;
    box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .rec-btn:hover{background:#f04a44}
  /* PERMINTAAN ("saat siap, di dalam tombol merah ada BULATAN PUTIH seukuran kotak putih yang
     muncul saat merekam"): bentuknya yang berubah, bukan ukurannya - bulat saat siap, kotak saat
     merekam. Ukurannya tetap 13px di kedua keadaan supaya pergantiannya terasa sebagai satu
     tombol yang sama berubah bentuk, bukan sesuatu yang muncul-hilang. */
  .rec-inner{width:13px;height:13px;background:#fff;border-radius:50%;display:block;
    transition:border-radius .15s ease}
  .rec-btn.recording .rec-inner{border-radius:2px}
  .send-btn{width:36px;height:36px;border-radius:50%;background:#25d366;color:#fff;border:none;
    font-size:15px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .send-btn:disabled{opacity:.5;cursor:default}
  /* PERMINTAAN ("pilihan rekam: suara dalam aplikasi, hanya microphone, atau keduanya").
     PERBAIKAN (dilaporkan: "tombol kirim tidak ada" + "tidak ada pilihan hanya suara aplikasi"):
     versi SEBELUMNYA memakai segmented control 3 tombol ikon (🎤/🔊/🎤🔊) yang memakan ~90px -
     di bar selebar 360px itu mendorong tombol jeda & KIRIM keluar dari area yang terlihat,
     sekaligus ikonnya sendiri ambigu (🔊 tidak terbaca sebagai "suara aplikasi"). Diganti
     dropdown NATIVE berlabel kata (pola SAMA seperti .mic-select) - jauh lebih hemat ruang dan
     maksudnya jelas terbaca, tanpa ikon speaker sama sekali. */
  .src-select{flex-shrink:0;max-width:84px;font-size:9.5px;color:rgba(233,237,239,.7);background:#111b21;
    border:none;cursor:pointer;padding:2px 0}
  @media(prefers-color-scheme:dark){ .src-select{color:rgba(233,237,239,.65)} }
  .status{text-align:center;font-size:10.5px;color:#e53935;padding:0 10px 8px;line-height:1.3}
  .status.success{color:#128C7E}
  /* PERMINTAAN ("hilangkan tulisan 'Mengirim...' dan blok panjangnya, cukup panah kembali di
     tengah layar kosong, aplikasi jangan terkesan lambat"): begitu tombol kirim ditekan, bar
     perekaman langsung diganti layar KOSONG ini (bukan teks progres apa pun) - pengiriman
     berjalan diam-diam di latar belakang (lihat uploadRecording() di script). Panah selalu bisa
     diklik kapan saja untuk kembali ke menu chat (window.close()), tidak menunggu upload
     selesai - itu pilihan sadar user kalau mau buru-buru pergi sebelum kirim tuntas, sama
     seperti menutup tab di aplikasi lain saat sesuatu masih berjalan di background. */
  .back-screen{display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;height:70px;width:100%}
  .back-screen.show{display:flex}
  /* PERMINTAAN ("ganti tombol kembali dengan tombol panah yang agak besar dan sesuai"): panah
     kecil abu-abu diganti tombol bundar hijau senada tombol kirim - jauh lebih terlihat sebagai
     tombol & konsisten dengan palet chat. */
  .back-btn{background:#008069;border:none;font-size:24px;cursor:pointer;color:#fff;
    width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.25);line-height:1}
  .back-btn:hover{background:#00a884}
  /* Perlindungan yang SAMA seperti di video.html: menutup jendela selagi unggahan berjalan
     membunuh permintaannya. Audio memang biasanya kecil & selesai seketika, tapi rekaman panjang
     atau jaringan lambat bisa kena masalah yang persis sama - jadi dikunci juga di sini.
     Isyaratnya cincin berputar, tanpa tulisan "Mengirim...". */
  .back-btn.uploading{cursor:default;position:relative}
  .back-btn.uploading::after{content:'';position:absolute;inset:-6px;border-radius:50%;
    border:2px solid rgba(255,255,255,.22);border-top-color:#25d366;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .back-err{font-size:9.5px;color:#e53935;text-align:center;padding:0 12px;line-height:1.3}
  @media(prefers-color-scheme:dark){ .back-btn{color:rgba(233,237,239,.75)} .back-btn:hover{background:rgba(255,255,255,.08)} }
  @media(prefers-color-scheme:dark){
    html,body{background:#0b141a}
    /* Gelap: warna wallpaper chat versi gelap (SAMA seperti .chat-bubble.incoming di app). */
    .card{background:#111b21}
    .icon-btn{color:rgba(233,237,239,.65)}
    .icon-btn:hover{background:rgba(255,255,255,.08)}
    .timer{color:#e9edef}
    .waveform{background-image:linear-gradient(to right,#3b4a54 55%,transparent 0%)}
  }
  /* PERMINTAAN ("dibuat kartu di HP agar tidak berpindah ke tab baru"): mikrofon TIDAK BISA
     diakses dari dalam iframe sandbox Apps Script (batasan Permissions-Policy platform,
     dikonfirmasi gagal di semua device - lihat [[project_chat_feature]]) - halaman ini WAJIB
     tetap jadi browsing context top-level terpisah, itu tidak berubah. Yang BISA diperbaiki:
     di HP, window.open() mengabaikan ukuran 360x70 (fitur popup kecil cuma ditaati desktop) dan
     membuka TAB PENUH LAYAR - bar tipis di atas jadi terasa "pindah ke situs asing" karena
     mengambang sendirian di layar kosong. Deteksi kasus itu lewat tinggi viewport (jendela
     popup asli SELALU pas 70px, tab HP penuh SELALU jauh lebih tinggi) - saat itu terjadi,
     bungkus bar jadi KARTU mengambang di tengah layar dengan latar redup di belakangnya, gaya
     dialog/bottom-sheet yang lazim di app ini, supaya terasa seperti bagian dari aplikasi
     walau teknisnya tetap tab terpisah. */
  /* PERMINTAAN ("warna POP perekaman audio jadikan seperti pop perekaman video lingkaran"):
     dulu latar belakangnya lapisan redup semi-transparan (rgba hitam) - itu membuat warnanya
     berubah-ubah mengikuti apa pun yang ada di belakangnya. video.html memakai warna PADAT
     #0b141a; disamakan supaya kedua pop benar-benar identik. Ukuran & bayangan kartu juga
     disamakan (min(360px,94vw), bayangan .45). */
  @media(min-height:200px){
    body{background:#0b141a;align-items:center}
    .card{width:min(360px,94vw);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.45);overflow:hidden}
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="card-head" id="cardHead"><button type="button" class="head-back" id="headBackBtn" title="Kembali ke Chat" aria-label="Kembali ke Chat">&#8592;</button><span class="ch-dot"></span><span>Chat Audio</span></div>
  <div class="bar" id="bar">
    <button type="button" class="icon-btn" id="trashBtn" title="Batal">🗑️</button>
    <!-- PERMINTAAN ("pilihan rekam: suara dalam aplikasi / hanya microphone / keduanya" +
         "ganti icon microphone dengan mic podcast 🎙️, tanpa icon speaker") -->
    <select id="srcSelect" class="src-select" title="Sumber rekaman">
      <option value="mic">🎙️ Mikrofon</option>
      <option value="system">Suara aplikasi</option>
      <option value="both">Mikrofon + aplikasi</option>
    </select>
    <select id="micSelect" class="mic-select" title="Pilih mikrofon" style="display:none"></select>
    <span class="dot" id="dot"></span>
    <span class="timer" id="timer">0:00</span>
    <span class="waveform"></span>
    <!-- Play/pause HANYA untuk mendengarkan hasil rekaman - muncul setelah perekaman berhenti. -->
    <button type="button" class="icon-btn" id="playBtn" title="Dengarkan" style="display:none">▶️</button>
    <button type="button" class="rec-btn" id="recBtn" title="Mulai merekam"><span class="rec-inner"></span></button>
    <button type="button" class="send-btn" id="sendBtn" title="Kirim">➤</button>
    <audio id="previewAudio" preload="auto" style="display:none"></audio>
  </div>
  <div class="status" id="status"></div>
  <div class="back-screen" id="backScreen">
    <button type="button" class="back-btn" id="backBtn" title="Kembali ke Chat" aria-label="Kembali ke Chat">&#8592;</button>
    <div class="back-err" id="backErr" style="display:none"></div>
  </div>
</div>
<script>
// PERMINTAAN ("mic voice note gagal di semua platform, batasan iframe Apps Script") - halaman
// statis INI (di-host GitHub Pages, TERPISAH dari deployment Apps Script - lihat doPost() di
// Kode.js untuk sisi penerimanya) berjalan sebagai tab browser TOP-LEVEL biasa, BUKAN di dalam
// iframe sandbox Google, jadi getUserMedia() bekerja normal di sini. token/groupId/webapp
// dibaca dari URL HASH (bukan query string) supaya TIDAK ikut terkirim ke server hosting/log
// (fragment URL murni sisi-klien) - lihat startChatVoiceRecording() di chat_js.html untuk
// bagaimana halaman ini dibuka (window.open kecil, diposisikan tepat di atas tombol mic).
function getHashParams() {
  var hash = location.hash.replace(/^#/, '');
  var params = {};
  hash.split('&').forEach(function (pair) {
    var idx = pair.indexOf('=');
    if (idx === -1) return;
    params[decodeURIComponent(pair.slice(0, idx))] = decodeURIComponent(pair.slice(idx + 1));
  });
  return params;
}
var PARAMS = getHashParams();
var barEl = document.getElementById('bar');
var timerEl = document.getElementById('timer');
var dotEl = document.getElementById('dot');
var statusEl = document.getElementById('status');
var trashBtn = document.getElementById('trashBtn');
var recBtn = document.getElementById('recBtn');
var playBtn = document.getElementById('playBtn');
var previewAudioEl = document.getElementById('previewAudio');
var sendBtn = document.getElementById('sendBtn');
var micSelectEl = document.getElementById('micSelect');

function setStatus(msg, kind) {
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}
var backScreenEl = document.getElementById('backScreen');
var backErrEl = document.getElementById('backErr');
function showBackScreen() { backScreenEl.classList.add('show'); }
function showBackError(msg) { backErrEl.textContent = msg; backErrEl.style.display = 'block'; }
document.getElementById('backBtn').onclick = function () { window.close(); };
// Tombol kembali di header - selalu tersedia, termasuk SEBELUM merekam apa pun. Kalau ada
// rekaman yang sedang berjalan, hentikan dulu supaya mikrofon benar-benar dilepas (indikator
// "sedang merekam" milik browser tidak menggantung) sebelum jendelanya ditutup.
document.getElementById('headBackBtn').onclick = function () {
  try { if (mediaRecorder && mediaRecorder.state !== 'inactive') { cancelled = true; mediaRecorder.stop(); } } catch (e) {}
  try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
  try { stopExtraStreams(); } catch (e) {}
  window.close();
};

var mediaRecorder = null, chunks = [], stream = null, startTime = 0, timerInterval = null;
var pausedTotal = 0, pauseStart = 0, isPaused = false, cancelled = false, micSwitching = false;
// PERMINTAAN ("dropdown mikrofon, tetap sesuai pilihan terakhir sampai diganti sendiri oleh
// user"): deviceId tersimpan PERMANEN di localStorage (bukan per-sesi) - dipakai lagi otomatis
// di rekaman berikutnya tanpa user perlu memilih ulang, sampai user sendiri ganti pilihan.
var MIC_DEVICE_KEY = 'chat_voice_mic_device_id';
// Nama/label perangkat HANYA terisi browser setelah izin mic diberikan (privasi) - jadi daftar
// ini diisi/diperbarui SETELAH getUserMedia() pertama berhasil (lihat startRecording()), bukan
// di awal load halaman.
function populateMicList() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
  navigator.mediaDevices.enumerateDevices().then(function (devices) {
    var mics = devices.filter(function (d) { return d.kind === 'audioinput'; });
    // PERMINTAAN ("dropdown supaya user bisa ganti microphone JIKA tersedia beberapa"): kalau
    // cuma ada satu (atau nol) mic, tidak ada yang perlu dipilih - sembunyikan dropdown-nya.
    if (mics.length <= 1) { micSelectEl.style.display = 'none'; return; }
    micSelectEl.style.display = '';
    var saved = localStorage.getItem(MIC_DEVICE_KEY);
    micSelectEl.innerHTML = mics.map(function (d, i) {
      return '<option value="' + d.deviceId + '">' + (d.label || ('Mikrofon ' + (i + 1))) + '</option>';
    }).join('');
    if (saved && mics.some(function (d) { return d.deviceId === saved; })) micSelectEl.value = saved;
    else localStorage.setItem(MIC_DEVICE_KEY, micSelectEl.value);
  }).catch(function () {});
}
// Ganti mic = mulai ulang rekaman dengan device baru (MediaRecorder tidak mendukung mengganti
// sumber stream di tengah jalan) - rekaman sejauh ini dibuang, timer reset, TIDAK menutup
// jendela (beda dari trashBtn/batal - micSwitching membedakan keduanya di onRecordingStop()).
micSelectEl.onchange = function () {
  localStorage.setItem(MIC_DEVICE_KEY, micSelectEl.value);
  // Mengganti mikrofon saat SEDANG merekam = ulang dari awal dengan device baru. Saat TIDAK
  // merekam, dropdown hanya menyimpan pilihan - memulai perekaman kini tugas tombol rec khusus.
  if (mediaRecorder && mediaRecorder.state !== 'inactive') { micSwitching = true; stopRecording(false); }
};
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
  navigator.mediaDevices.addEventListener('devicechange', populateMicList);
}

function formatTime(sec) {
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
function updateTimer() {
  if (isPaused) return;
  var sec = Math.max(0, Math.floor((Date.now() - startTime - pausedTotal) / 1000));
  timerEl.textContent = formatTime(sec);
}

// PERMINTAAN ("saat layar TV memutar siaran, sediakan pilihan rekam: suara dalam aplikasi,
// hanya microphone, atau keduanya"):
//   mic    -> getUserMedia (seperti sebelumnya)
//   system -> getDisplayMedia: user memilih TAB APLIKASI di dialog browser & mencentang "Bagikan
//             audio tab" - itulah suara siaran YouTube yang sedang diputar di layar TV. Track
//             VIDEO-nya langsung dihentikan (hanya audionya yang kita butuhkan) supaya tidak ada
//             beban rekaman gambar sama sekali.
//   both   -> KEDUANYA digabung lewat Web Audio API (dua MediaStreamSource -> satu
//             MediaStreamDestination) - MediaRecorder hanya bisa merekam SATU stream, jadi
//             pencampuran wajib dilakukan sendiri, bukan sekadar menggabung track.
// CATATAN JUJUR (batasan platform, bukan pilihan implementasi): getDisplayMedia untuk audio tab
// HANYA tersedia di browser desktop berbasis Chromium (Chrome/Edge) - Firefox/Safari dan SEMUA
// browser HP tidak mendukungnya. Di perangkat itu pilihan 🔊/🎤🔊 otomatis kembali ke mikrofon
// saja disertai pesan singkat, bukan gagal diam-diam.
var SRC_KEY = 'chat_voice_source';
var recSource = (function () { try { return localStorage.getItem(SRC_KEY) || 'mic'; } catch (e) { return 'mic'; } })();
var mixCtx = null, extraStreams = [];
function stopExtraStreams() {

      // menit lalu dibatalkan - dari sisi user itu terasa seperti "tidak boleh merekam lama".
      // Sekarang tenggatnya mengikuti UKURAN berkas (2 menit + 2 menit per MB), jadi rekaman
      // sepanjang apa pun tetap diberi waktu yang sepadan. Timeout tidak dihapus sama sekali:
      // tanpa batas apa pun, unggahan yang benar-benar mati akan menggantung selamanya tanpa
      // pernah memberi kabar - itu justru lebih buruk daripada gagal dengan jelas.
      xhr.timeout = 120000 + Math.round((blob.size / 1048576) * 120000);
      // AKAR MASALAH (dilaporkan: "kirim audio juga LANGSUNG gagal, hanya berputar sedikit" -
      // padahal sebelumnya audio berhasil, cuma lambat): JANGAN pasang event listener apa pun di
      // xhr.upload. Menurut spesifikasi CORS, permintaan lintas-origin yang punya listener di
      // XMLHttpRequestUpload BUKAN LAGI "simple request" - browser wajib mengirim preflight
      // OPTIONS lebih dulu. Apps Script TIDAK menangani OPTIONS sama sekali, jadi preflight-nya
      // gagal dan XHR langsung error sebelum satu byte pun terkirim. Itu persis "berputar sedikit
      // langsung gagal", dan menjelaskan juga kenapa Chat Video mulai selalu gagal "koneksi
      // terputus" tepat setelah cincin progres (yang memakai xhr.upload.onprogress) ditambahkan -
      // dua gejala berbeda, satu sebab. Konsekuensinya progres unggahan nyata tidak bisa dipakai
      // di jalur ini; itu harga yang jauh lebih murah daripada unggahan yang tidak pernah jalan.
      xhr.onload = function () {
        var json = null; try { json = JSON.parse(xhr.responseText); } catch (e) {}
        if (json && json.success) { window.close(); return; }
        unlockBack();
        if (json && json.error) { showBackError(json.error + ' (' + sizeMb + ' MB)'); return; }
        showBackError('Server menjawab ' + xhr.status + ' (' + sizeMb + ' MB). ' + String(xhr.responseText || '').replace(/<[^>]*>/g, ' ').trim().slice(0, 90));
      };
      // Kegagalan JARINGAN (bukan jawaban server) - inilah yang dulu selalu muncul sebagai
      // "Failed to fetch". Dicoba ulang sekali sebelum menyerah.
      var fail = function (sebab) {
        // Tiga percobaan total - lihat catatan yang sama di video.html.
        if (attempt < 3) { setStatus('Koneksi terputus, mencoba ulang...', ''); send(); return; }
        unlockBack();
        // Rekamannya masih utuh di memori - dikembalikan ke layar review supaya tombol kirim bisa
        // ditekan lagi. Tanpa ini user terjebak di layar panah dengan satu-satunya jalan keluar
        // menutup jendela, artinya rekaman yang sudah jadi ikut terbuang percuma.
        backScreenEl.classList.remove('show');
        barEl.classList.add('show');
        sendBtn.disabled = false;
        setStatus('Gagal (' + sizeMb + ' MB): ' + sebab + ' - tekan kirim lagi', 'error');
      };
      xhr.onerror = function () { fail('koneksi terputus'); };
      xhr.ontimeout = function () { fail('waktu unggah habis'); };
      xhr.send(form);
    };
    send();
  };
  reader.readAsDataURL(blob);
}
// PERBAIKAN (dilaporkan: "sudah klik tong sampah tapi tombol kirim masih bisa ditekan"): dulu
// tong sampah HANYA memanggil stopRecording(true), yang berarti "batalkan perekaman yang sedang
// berjalan lalu tutup jendela". Setelah ada keadaan REVIEW, perekamnya sudah inactive - jadi
// pemanggilan itu tidak melakukan apa pun sama sekali: rekaman tetap tersimpan dan tombol kirim
// tetap hidup. Sekarang tong sampah membaca keadaan: sedang merekam -> batal & tutup seperti
// dulu; sudah ada hasil rekaman -> hasilnya DIBUANG dan tampilan kembali ke keadaan siap
// (tombol kirim otomatis redup lagi lewat setIdleUi()).
trashBtn.onclick = function () {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') { stopRecording(true); return; }
  if (recordedBlob) { setIdleUi(); setStatus('', ''); return; }
  window.close();
};
// Satu tombol KHUSUS rekam/stop: siap -> mulai, sedang merekam -> berhenti, sudah ada hasil ->
// rekam ulang (hasil lama dibuang lebih dulu supaya tidak ada blob nyasar ikut terkirim).
recBtn.onclick = function () {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') { stopRecording(false); return; }
  clearPreview();
  setStatus('', '');
  startRecording();
};
playBtn.onclick = togglePreviewPlay;
// Kirim HANYA memakai rekaman yang sudah selesai & sempat didengarkan - kalau tombol ini ditekan
// saat masih merekam (seharusnya tidak bisa, sendBtn dimatikan), perekaman dihentikan dulu.
sendBtn.onclick = function () {
  // Sama seperti di video.html: tidak boleh berhenti diam-diam - kalau tidak ada yang bisa
  // dikirim, katakan alasannya.
  if (!recordedBlob) {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') { stopRecording(false); return; }
    setStatus('Belum ada rekaman untuk dikirim - tekan tombol merah dulu untuk merekam.', 'error');
    return;
  }
  // groupId hanya wajib untuk tujuan CHAT. Rekaman untuk Tabel Setoran (target=setoran) memang
  // tidak punya grup - tanpa pengecualian ini, perekam menolak mengirim sebelum mencoba.
  if (!PARAMS.webapp || !PARAMS.token || (PARAMS.target !== 'setoran' && !PARAMS.groupId)) {
    setStatus('Data sesi tidak terbaca - tutup halaman ini lalu buka lagi lewat tombol mikrofon.', 'error');
    return;
  }
  try { previewAudioEl.pause(); } catch (e) {}
  uploadRecording(recordedBlob, recordedMime, recordedSec);
};

// PERBAIKAN (dilaporkan: "halaman perekaman video untuk setoran menolak dibuka"): guard di
// TITIK MASUK ini terlewat saat jalur setoran ditambahkan - guard di fungsi kirim sudah
// dilonggarkan, tapi yang ini menolak lebih dulu sehingga kameranya tidak pernah menyala.
// groupId hanya wajib untuk tujuan CHAT; rekaman untuk Tabel Setoran memang tidak punya grup.
if (PARAMS.token && PARAMS.webapp && (PARAMS.groupId || PARAMS.target === 'setoran')) {
  // PERMINTAAN (revisi - "jangan otomatis langsung merekam, karena di halaman perekaman ada
  // pengaturan sumber audio dll - user yang memulai di sini"): halaman terbuka dalam keadaan
  // SIAP, bukan sudah merekam. User mengatur sumber & mikrofon dulu, baru menekan ▶ untuk mulai
  // (tombol yang sama berganti peran jadi ⏸ jeda setelah berjalan - lihat setIdleUi()).
  setIdleUi();
} else {
  // PERMINTAAN ("keterangan jangan membingungkan"): kalimat lama ("Tautan tidak lengkap")
  // memakai istilah teknis yang tidak berarti apa-apa bagi pengguna & tidak memberi tahu apa
  // yang harus dilakukan. Diganti kalimat biasa + tombol tutup, dan bar perekaman disembunyikan
  // supaya tidak ada kontrol yang terlihat bisa dipakai padahal tidak akan berfungsi.
  barEl.classList.remove('show');
  showBackScreen();
  showBackError('Halaman ini hanya bisa dipakai dari tombol mikrofon di dalam aplikasi. Silakan tutup, lalu tekan tombol mikrofon di halaman Chat.');
}
</script>
